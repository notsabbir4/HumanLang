name: release
# Runs when you push a tag like v0.1.0
on:
  push:
    tags: ["v*"]
jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: hl-linux }
          - { os: macos-latest, name: hl-macos }
          - { os: windows-latest, name: hl-windows.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --onefile --name hl --icon packaging/icon.ico packaging/hl_entry.py
      - name: Rename (Unix)
        if: runner.os != 'Windows'
        run: mv dist/hl dist/${{ matrix.name }}
      - name: Rename (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/hl.exe dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "dist/${{ matrix.name }}" }
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - uses: actions/download-artifact@v4
        with: { path: binaries, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/*
            dist/*
  pypi:
    # Optional: needs a "pypi" environment and a trusted publisher set up on pypi.org
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

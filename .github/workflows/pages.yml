name: website
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"          # refresh the Community snapshot
  workflow_run:
    workflows: [community]           # a post was just checked: show it soon
    types: [completed]
permissions: { contents: read, pages: write, id-token: write, issues: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install markdown && python website/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/dist }
      - id: deploy
        uses: actions/deploy-pages@v4

name: Bug report
description: HL crashed, ran wrongly, or printed Python errors instead of a friendly message
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: The program
      description: The smallest program that shows the problem.
      render: text
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened (paste the whole message)
      render: text
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version (hl --version) and system
      placeholder: HumanLang 0.1.1, Windows 11
    validations: { required: true }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "humanlang"
version = "0.1.1"
description = "HumanLang (HL): a beginner-friendly programming language that reads like English."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "HumanLang contributors" }]
keywords = ["programming language", "education", "beginners", "interpreter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/notsabbir4/humanlang"
Documentation = "https://notsabbir4.github.io/humanlang/"
Issues = "https://github.com/notsabbir4/humanlang/issues"

[project.scripts]
hl = "humanlang.cli:main"

[tool.setuptools]
packages = ["humanlang"]
